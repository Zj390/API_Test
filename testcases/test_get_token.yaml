-
  feature: 模块
  story: 接口
  title: 获取微信access_token
  marks:
    - smoke
  request:
    method: get
    url: https://api.weixin.qq.com/cgi-bin/token
    headers: null
    params:
      grant_type: client_credential
      appid: ${env:WECHAT_APPID}
      secret: ${env:WECHAT_SECRET}
  validate:
    status_code: 200
    exists:           # 以此为名的字段要存在
      - access_token
    not_empty:        # 此字段对应的值不能为空
      - access_token
    greater_than:
      expires_in: 0
  extract:
    access_token:
      source: json
      field: access_token
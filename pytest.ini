[pytest]
# 配置参数，‘-vs’:详细 + 显示print
addopts = -v
# ‘-m’:只运行指定哪个标记用例，如果想执行多个，可用‘or’链接

# 防止中文不转义成ASCII码
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# 改变用例的查找规则
testpaths =
    ./testcases
    ./tests

# 改变模块的查找规则
python_files = test_*.py

# 改变类的查找规则
python_classes = Test*

#改变函数的查找规则
python_functions = test_*

# 标记
markers =
    smoke:冒烟测试
    user:用户管理
    unit:框架单元测试

# 开启实时日志输出
log_cli = true

# 设置控制台显示的最低日志级别
log_cli_level = INFO

# 设置每条日志的显示格式
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s

# 设置时间格式
log_cli_date_format = %Y-%m-%d %H:%M:%S
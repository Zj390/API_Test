name: Unit Tests

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python 3.11 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 下载项目代码
        uses: actions/checkout@v7

      - name: 配置Python环境
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 运行单元测试
        run: python run.py -m unit

      - name: 保存HTML测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-html-report
          path: reports/unit_report_*.html
          if-no-files-found: error
          retention-days: 14
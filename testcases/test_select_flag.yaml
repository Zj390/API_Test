-
  feature: 模块
  story: 接口
  title: 查询微信标签
  case_id: select_wechat_tags
  depends_on:
    - get_wechat_token
  marks:
    - user
  request:
    method: get
    url: https://api.weixin.qq.com/cgi-bin/tags/get
    headers: null
    params:
      access_token: ${access_token}

  validate:
    status_code: 200
    exists:
      - tags
    types:
      tags: list